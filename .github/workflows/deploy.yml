name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Run every trading hour during NSE market hours (09:15 to 16:15 IST / 03:45 to 10:45 UTC)
    # 03:45 UTC = 09:15 IST (Market Open)
    # 05:00 UTC = 10:30 IST (Morning Session)
    # 07:00 UTC = 12:30 IST (Midday Session)
    # 09:00 UTC = 14:30 IST (Afternoon Session)
    # 10:15 UTC = 15:45 IST (Market Close Settlement)
    # 10:45 UTC = 16:15 IST (Final Bhavcopy Settled)
    - cron: '45 3,5,7,9,10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install yfinance

      - name: Update Daily Settled Market Data
        run: |
          python scripts/update_market_data.py

      - name: Commit and push updated market data back to main
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add frontend/src/data/real_history.json frontend/public/live_quotes.json frontend/src/data/live_quotes.json frontend/src/data/market.ts backend/main.py
          git diff --staged --quiet || (git commit -m "Automated hourly NSE market quote sync [skip ci]" && git push origin main)

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build production bundle
        run: |
          cd frontend
          npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'frontend/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/dist
